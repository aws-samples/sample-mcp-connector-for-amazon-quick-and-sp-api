AWSTemplateFormatVersion: "2010-09-09"
Description: >
  SP-API LWA credentials secret for the Quick <-> SP-API AgentCore connector.
  The value (client id/secret + refresh token) is written post-deploy by deploy.sh,
  so credentials never appear in the CloudFormation template or parameters.

Parameters:
  SecretName:
    Type: String
    Description: Name of the Secrets Manager secret the Lambda reads (e.g. quick-spapi/seller/lwa).

Resources:
  SpApiSecret:
    Type: AWS::SecretsManager::Secret
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_149
            comment: Encrypted with the AWS managed key (aws/secretsmanager), whose key policy allows use only through Secrets Manager by principals in this account. The secret is never shared cross-account and the only principal this sample grants read access to is the adapter Lambda role; other access is governed by the account's own IAM policies. A customer managed key would not narrow that further without a matching key and resource policy.
      cfn_nag:
        rules_to_suppress:
          - id: W77
            reason: Encrypted with the AWS managed key (usable only via Secrets Manager within this account); never shared cross-account; the sample grants read access only to the adapter Lambda role.
      guard:
        SuppressedRules:
          - SECRETSMANAGER_ROTATION_ENABLED_CHECK
      # SECRETSMANAGER_ROTATION_ENABLED_CHECK: the value is a Login with Amazon client secret and
      # refresh token. They are rotated through the SP-API Application Management API and app
      # re-authorization (see README "Rotating credentials"), not by a Secrets Manager rotation
      # function, which cannot mint new LWA credentials.
    Properties:
      Name: !Ref SecretName
      Description: LWA client id/secret + SP-API refresh token for one selling partner.

Outputs:
  SecretArn:
    Description: ARN of the SP-API credentials secret.
    Value: !Ref SpApiSecret
  SecretName:
    Value: !Ref SecretName
